<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TUINCOME v7</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#050b09;
  --bg2:#08130f;
  --card:#0d1c15;
  --card2:#102319;
  --green:#39ff88;
  --green2:#00d66b;
  --text:#ecfff4;
  --muted:#8ca99a;
  --border:#1b412e;
  --red:#ff5b6e;
  --gold:#ffd700;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  padding-bottom:90px;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* HEADER */

header{
  height:72px;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#07150e;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:var(--green);
  font-size:22px;
  font-weight:900;
  text-shadow:0 0 12px #39ff8870;
}

.lang{
  border:1px solid #39ff8850;
  background:#0c2116;
  color:var(--green);
  border-radius:20px;
  padding:8px 14px;
}

/* AUTH */

.auth-landing{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.auth-card{
  width:min(430px,100%);
  padding:24px;
  border-radius:24px;
  background:linear-gradient(145deg,#0e2017,#07110c);
  border:1px solid var(--border);
  box-shadow:0 10px 35px #0008;
}

.auth-card h2{
  text-align:center;
  margin:0 0 18px;
  color:var(--green);
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:18px;
}

.auth-tab{
  border:1px solid var(--border);
  background:#08130e;
  color:#8fa99b;
  padding:11px;
  border-radius:12px;
  font-weight:800;
}

.auth-tab.active{
  background:#103520;
  color:var(--green);
  border-color:#39ff8860;
}

.social-btn{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  background:#08130e;
  color:white;
  border:1px solid var(--border);
  font-weight:800;
}

.google{
  color:#ff625b;
  border-color:#ff625b55;
}

.facebook{
  color:#4b9cff;
  border-color:#4b9cff55;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  margin:17px 0;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:var(--border);
  flex:1;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  color:#b9d1c2;
  font-size:13px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:#06100b;
  color:white;
}

input:focus,
select:focus{
  border-color:var(--green);
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#39ff88,#00b95c);
  color:#031008;
  font-weight:900;
}

.error-box,
.success-box{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-word;
}

.error-box{
  background:#3a1018;
  border:1px solid #ff526855;
  color:#ffb8c0;
}

.success-box{
  background:#0c321e;
  border:1px solid #39ff8855;
  color:#baffd1;
}

.small-note{
  margin-top:14px;
  color:#718a7c;
  font-size:11px;
  text-align:center;
  line-height:1.5;
}

/* DASHBOARD */

#mainDashboard{
  display:none;
}

.container{
  width:min(720px,100%);
  margin:auto;
  padding:15px 10px;
}

.banner{
  padding:22px;
  border-radius:24px;
  background:
    radial-gradient(circle at top right,#1b6b3c55,transparent 50%),
    linear-gradient(135deg,#092719,#07120d);
  border:1px solid #1f5136;
  margin-bottom:14px;
}

.banner small{
  color:var(--green);
  font-weight:800;
}

.banner h1{
  margin:8px 0;
  font-size:26px;
}

.banner p{
  margin:0;
  color:#9ab5a5;
  line-height:1.5;
}

.balance-card{
  margin-top:16px;
  padding:20px;
  border-radius:20px;
  background:#07160e;
  border:1px solid #1b4b30;
}

.balance-label{
  color:#86a292;
  font-size:13px;
}

.balance{
  font-size:38px;
  font-weight:900;
  color:var(--green);
  margin-top:4px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:14px 0;
}

.quick-btn{
  min-height:82px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#0a1811;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.quick-btn i{
  color:var(--green);
  font-size:21px;
}

.quick-btn span{
  font-size:11px;
}

.card{
  padding:17px;
  border-radius:20px;
  background:linear-gradient(145deg,#0d1c15,#09140f);
  border:1px solid var(--border);
  margin-bottom:13px;
}

.card h3{
  margin:0 0 13px;
}

.task-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:10px;
  border-radius:16px;
  background:#08150e;
  border:1px solid #183a28;
}

.task-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#0e2c1b;
  display:grid;
  place-items:center;
  color:var(--green);
  flex-shrink:0;
}

.task-info{
  flex:1;
  min-width:0;
}

.task-info b{
  display:block;
  margin-bottom:4px;
}

.task-info small{
  color:#718c7d;
}

.task-reward{
  color:var(--green);
  font-weight:900;
}

.task-btn{
  margin-top:7px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #39ff8850;
  background:#143b24;
  color:var(--green);
  font-weight:800;
}

/* NAV */

.nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(720px,100%);
  height:76px;
  background:#07110c;
  border:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:15;
  border-radius:25px 25px 0 0;
}

.nav button{
  border:0;
  background:none;
  color:#71887b;
  font-size:18px;
}

.nav button span{
  display:block;
  font-size:10px;
  margin-top:4px;
}

.nav button.active{
  color:var(--green);
}

.nav .go{
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#48ff9a,#00a957);
  color:#031008;
  border:4px solid #07140d;
  margin-top:-28px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#000b;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:27px 27px 0 0;
  background:#09150f;
  border:1px solid var(--border);
}

.close{
  float:right;
  width:35px;
  height:35px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#0b1c13;
  color:white;
  font-size:22px;
}

.sheet h2{
  margin-top:0;
  color:var(--green);
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #173426;
}

.info-row span:first-child{
  color:#789184;
}

.history-item{
  padding:13px;
  border-radius:13px;
  background:#07120d;
  border:1px solid #173526;
  margin-bottom:9px;
}

.pending{
  color:#ffd15c;
}

.approved{
  color:var(--green);
}

.rejected{
  color:#ff6878;
}

/* TASK MODAL */

.task-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000d;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.task-box{
  width:min(400px,100%);
  padding:25px;
  border-radius:24px;
  text-align:center;
  background:#09170f;
  border:1px solid #235b39;
}

.countdown{
  font-size:58px;
  font-weight:900;
  color:var(--green);
  margin:15px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#183022;
  overflow:hidden;
  margin-bottom:18px;
}

.progress div{
  height:100%;
  width:0;
  background:var(--green);
  transition:width 1s linear;
}

.loading{
  color:#789184;
  text-align:center;
  padding:15px;
}

.empty{
  color:#789184;
  padding:15px;
  text-align:center;
}

@media(max-width:360px){
  .quick{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">▣ TUINCOME</div>
  <button class="lang" id="langBtn">🌐 EN</button>
</header>

<!-- AUTH -->

<section class="auth-landing" id="authLanding">

  <div class="auth-card">

    <h2 id="authTitle">লগইন করুন</h2>

    </button>

    <div id="registerFields" style="display:none">

      <div class="form-group">

    <div class="success-box" id="successBox"></div>

    <div class="small-note">

    </div>

  </div>
</section>


<!-- DASHBOARD -->

<section id="mainDashboard">

  <div class="container">

    <div class="banner">

      <small>TUINCOME v7</small>

      <h1>
        স্বাগতম,

      </p>

      <div class="balance-card">

<!-- GENERAL MODAL -->

</div>

      Task চলছে
    </h2>

      3
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <button class="primary"
            id="rewardBtn"
            style="display:none">

    </button>

  </div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://hgribbrofuqtfboaitgi.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmliYnJvZnVxdGZib2FpdGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzMyMjUsImV4cCI6MjEwMzE0OTIyNX0.VPFZ_jKsYDNO084W8qxkqYraY47iwiRGnQC6THLn-s8";

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let authMode = "login";
let currentTask = null;
let taskTimer = null;


/* =========================================================
   HELPER
========================================================= */

function $(id){
  return document.getElementById(id);
}


function showError(message){

  $("successBox").style.display = "none";
  $("errorBox").style.display = "block";
  $("errorBox").textContent = message;
}


function showSuccess(message){

  $("errorBox").style.display = "none";
  $("successBox").style.display = "block";
  $("successBox").textContent = message;
}


function clearMessages(){

  $("errorBox").style.display = "none";
  $("successBox").style.display = "none";
}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function getErrorMessage(error){

  if(!error){
    return "Unknown error";
  }

  let msg =
    error.message ||
    error.error_description ||
    String(error);

  if(
    msg.includes("Failed to fetch") ||
    msg.includes("Load failed") ||
    msg.includes("NetworkError")
  ){

    return (
      "Supabase server-এর সাথে কানেকশন হচ্ছে না।\n\n" +
      "১. Internet connection check করুন\n" +
      "২. Supabase URL/Key check করুন\n" +
      "৩. Supabase project active আছে কিনা দেখুন\n\n" +
      "Project URL:\n" +
      SUPABASE_URL
    );
  }

  return msg;
}


/* =========================================================
   AUTH MODE
========================================================= */

function setAuthMode(mode){

  authMode = mode;
  clearMessages();

  if(mode === "login"){

    $("authTitle").textContent = "লগইন করুন";

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");

    $("registerFields").style.display = "none";

    $("authBtn").textContent = "Login";

    $("password").autocomplete = "current-password";

  }else{

    $("authTitle").textContent =
      "নতুন Account তৈরি করুন";

    $("registerTab").classList.add("active");
    $("loginTab").classList.remove("active");

    $("registerFields").style.display = "block";

    $("authBtn").textContent = "Register";

    $("password").autocomplete = "new-password";
  }
}


/* =========================================================
   SUPABASE INIT
========================================================= */

function initSupabase(){

  if(!window.supabase){

    showError(
      "Supabase JavaScript library load হয়নি।\n\n" +
      "Internet connection check করে আবার site খুলুন।"
    );

    return false;
  }

  try{

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    return true;

  }catch(error){

    showError(
      "Supabase initialize করা যাচ্ছে না:\n\n" +
      getErrorMessage(error)
    );

    return false;
  }
}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser(){

  clearMessages();

  const name =
    $("name").value.trim();

  const phone =
    $("phone").value.trim();

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!name){
    showError("আপনার নাম দিন।");
    return;
  }

  if(phone && !/^01[0-9]{9}$/.test(phone)){
    showError("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।");
    return;
  }

  if(!email){
    showError("Gmail / Email দিন।");
    return;
  }

  if(password.length < 6){
    showError("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }

  $("authBtn").disabled = true;
  $("authBtn").textContent = "Register হচ্ছে...";

  try{

    const result =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            full_name:name,
            phone:phone
          }
        }

      });

    if(result.error){
      throw result.error;
    }

    if(result.data.session){

      currentUser =
        result.data.user;

      await loadProfile();

      showDashboard();

      showSuccess(
        "Account সফলভাবে তৈরি হয়েছে।"
      );

    }else{

      showSuccess(
        "Registration সফল হয়েছে।\n\n" +
        "আপনার Gmail inbox-এ verification email এলে " +
        "email verify করে Login করুন।"
      );
    }

  }catch(error){

    console.error(error);

    showError(
      "Registration failed:\n\n" +
      getErrorMessage(error)
    );

  }finally{

    $("authBtn").disabled = false;

    $("authBtn").textContent =
      authMode === "login"
        ? "Login"
        : "Register";
  }
}


/* =========================================================
   LOGIN
========================================================= */

async function loginUser(){

  clearMessages();

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!email){
    showError("Email দিন।");
    return;
  }

  if(!password){
    showError("Password দিন।");
    return;
  }

  $("authBtn").disabled = true;
  $("authBtn").textContent = "Login হচ্ছে...";

  try{

    const result =
      await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

      });

    if(result.error){
      throw result.error;
    }

    currentUser =
      result.data.user;

    await loadProfile();

    showDashboard();

  }catch(error){

    console.error(error);

    showError(
      "Login failed:\n\n" +
      getErrorMessage(error)
    );

  }finally{

    $("authBtn").disabled = false;
    $("authBtn").textContent = "Login";
  }
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

  if(!currentUser){
    return null;
  }

  const fallbackProfile = {

    id:currentUser.id,

    full_name:
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "User",

    phone:
      currentUser.user_metadata?.phone ||
      "",

    balance:0,

    referral_code:
      currentUser.id
        .substring(0,8)
        .toUpperCase()
  };


  try{

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(result.error){

      console.warn(
        "Profile select error:",
        result.error
      );

      currentProfile =
        fallbackProfile;

      return currentProfile;
    }


    if(result.data){

      currentProfile =
        result.data;

      if(currentProfile.balance == null){
        currentProfile.balance = 0;
      }

      return currentProfile;
    }


    const insertResult =
      await supabaseClient
        .from("profiles")
        .insert([{

          id:currentUser.id,

          full_name:
            fallbackProfile.full_name,

          phone:
            fallbackProfile.phone,

          balance:0,

          referral_code:
            fallbackProfile.referral_code

        }])
        .select()
        .maybeSingle();


    if(insertResult.error){

      console.warn(
        "Profile insert error:",
        insertResult.error
      );

      currentProfile =
        fallbackProfile;

    }else{

      currentProfile =
        insertResult.data ||
        fallbackProfile;
    }

    return currentProfile;

  }catch(error){

    console.error(error);

    currentProfile =
      fallbackProfile;

    return currentProfile;
  }
}

async function checkSession(){

  try{

    const result =
      await supabaseClient.auth.getSession();

    if(result.error){
      throw result.error;
    }

    const session =
      result.data.session;

    if(!session){

      $("authLanding").style.display = "flex";
      $("mainDashboard").style.display = "none";

      return;
    }

    currentUser =
      session.user;

    await loadProfile();

    showDashboard();

  }catch(error){

    console.error(error);

    $("authLanding").style.display = "flex";
    $("mainDashboard").style.display = "none";

    showError(
      "Session load failed:\n\n" +
      getErrorMessage(error)
    );
  }
}


/* =========================================================
   TASKS
========================================================= */

async function loadTasks(){

  const grid =
    $("taskGrid");

  grid.innerHTML =
    '<div class="loading">Task লোড হচ্ছে...</div>';

  try{

    const result =
      await supabaseClient
        .from("tasks")
        .select("*")
        .order("id",{ascending:true});

    if(result.error){
      throw result.error;
    }

    const tasks =
      (result.data || []).filter(task =>
        task.active === undefined ||
        task.active === true
      );

    if(!tasks.length){

      grid.innerHTML =
        '<div class="empty">এখন কোনো Task নেই।</div>';

      return;
    }

    grid.innerHTML = "";

    tasks.forEach(task => {

      const title =
        task.title || "Task";

      const description =
        task.description ||
        "Task সম্পন্ন করুন";

      const reward =
        Number(task.reward || 0);

      const card =
        document.createElement("div");

      card.className =
        "task-card";

      card.innerHTML = `

        <div class="task-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>

        <div class="task-info">

          <b>${escapeHTML(title)}</b>

          <small>
            ${escapeHTML(description)}
          </small>

          <br>

          <span class="task-reward">
            ৳${reward.toFixed(2)}
          </span>

          <br>

          <button class="task-btn">
            Start Task
          </button>

        </div>
      `;

      const button =
        card.querySelector(".task-btn");

      button.onclick =
        () => startTask(task,button);

      grid.appendChild(card);
    });

  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div style="
        color:#ff9ca8;
        padding:12px;
        background:#2b1017;
        border-radius:12px;
        line-height:1.5
      ">

        Task load failed.<br><br>

        ${escapeHTML(
          getErrorMessage(error)
        )}

      </div>
    `;
  }
}


/* =========================================================
   START TASK
========================================================= */

function startTask(task,button){

  if(!currentUser){

    alert("আগে Login করুন।");

    return;
  }

  if(taskTimer){
    clearInterval(taskTimer);
  }

  if(button){
    button.disabled = true;
  }

  currentTask =
    task;

  $("taskTitle").textContent =
    task.title || "Task চলছে";

  $("countdown").textContent =
    "3";

  $("progressBar").style.width =
    "0%";

  $("rewardBtn").style.display =
    "none";

  $("taskModal").style.display =
    "flex";

  let count = 3;

  taskTimer =
    setInterval(() => {

      count--;

      $("countdown").textContent =
        count;

      $("progressBar").style.width =
        ((3-count)/3*100) + "%";

      if(count <= 0){

        clearInterval(taskTimer);

        taskTimer = null;

        $("countdown").textContent =
          "✓";

        $("rewardBtn").style.display =
          "block";

      }

    },1000);
}


/* =========================================================
   CLAIM TASK REWARD
========================================================= */

async function claimReward(){

  if(!currentUser || !currentTask){
    return;
  }

  const button =
    $("rewardBtn");

  button.disabled = true;
  button.textContent = "Saving...";

  try{

    const reward =
      Number(currentTask.reward || 0);

    if(reward <= 0){
      throw new Error("Task reward invalid.");
    }


    /*
      Check whether this user already completed
      this task.
    */

    const existing =
      await supabaseClient
        .from("task_completions")
        .select("id")
        .eq("user_id",currentUser.id)
        .eq("task_id",currentTask.id)
        .limit(1);

    if(
      !existing.error &&
      existing.data &&
      existing.data.length > 0
    ){

      throw new Error(
        "আপনি এই Task আগে সম্পন্ন করেছেন।"
      );
    }


    /*
      Save completion first.
    */

    const completion =
      await supabaseClient
        .from("task_completions")
        .insert([{

          user_id:currentUser.id,

          task_id:currentTask.id,

          reward:reward

        }]);

    if(completion.error){
      throw completion.error;
    }


    /*
      Update profile balance.
    */

    const oldBalance =
      Number(currentProfile?.balance || 0);

    const newBalance =
      oldBalance + reward;

    const update =
      await supabaseClient
        .from("profiles")
        .update({
          balance:newBalance
        })
        .eq("id",currentUser.id);

    if(update.error){

      /*
        Completion already saved but balance failed.
        Reload profile so user sees actual database state.
      */

      await loadProfile();

      throw update.error;
    }


    currentProfile.balance =
      newBalance;

    updateBalance();

    $("taskModal").style.display =
      "none";

    currentTask = null;

    alert(
      "Task Complete!\n\n" +
      "Reward: ৳" +
      reward.toFixed(2)
    );

    loadTasks();

  }catch(error){

    console.error(error);

    alert(
      "Reward save করতে সমস্যা:\n\n" +
      getErrorMessage(error)
    );

  }finally{

    button.disabled = false;
    button.textContent = "৳ Reward নিন";
  }
}

/* =========================================================
   HISTORY
========================================================= */

async function openHistory(){

  openSheet(
    "History",
    '<div class="loading">Loading...</div>'
  );

  let items = [];

  try{

    const deposits =
      await supabaseClient
        .from("deposits")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false})
        .limit(20);

    if(!deposits.error){

      (deposits.data || []).forEach(item => {

        items.push({

          type:"Deposit",

          amount:
            Number(item.amount || 0),

          status:
            item.status || "pending",

          created_at:
            item.created_at || ""

        });

      });
    }

  }catch(error){

    console.warn(error);
  }


  try{

    const withdrawals =
      await supabaseClient
        .from("withdrawals")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false})
        .limit(20);

    if(!withdrawals.error){

      (withdrawals.data || []).forEach(item => {

        items.push({

          type:"Withdrawal",

          amount:
            Number(item.amount || 0),

          status:
            item.status || "pending",

          created_at:
            item.created_at || ""

        });

      });
    }

  }catch(error){

    console.warn(error);
  }


  if(!items.length){

    $("sheetBody").innerHTML =
      '<div class="empty">কোনো History পাওয়া যায়নি।</div>';

    return;
  }


  items.sort((a,b) =>
    String(b.created_at)
      .localeCompare(String(a.created_at))
  );


  $("sheetBody").innerHTML =
    items.map(item => `

      <div class="history-item">

        <b>
          ${escapeHTML(item.type)}
        </b>

        <br>

        Amount:
        ৳${item.amount.toFixed(2)}

        <br>

        Status:

        <span class="${statusClass(item.status)}">
          ${escapeHTML(item.status)}
        </span>

        ${
          item.created_at
          ?
          `<br>
           <small style="color:#718c7d">
             ${escapeHTML(
               new Date(item.created_at).toLocaleString()
             )}
           </small>`
          :
          ""
        }

      </div>

    `).join("");
}


function statusClass(status){

  status =
    String(status || "")
      .toLowerCase();

  if(
    status === "approved" ||
    status === "completed"
  ){
    return "approved";
  }

  if(status === "rejected"){
    return "rejected";
  }

  return "pending";
}

/* =========================================================
   OAUTH
========================================================= */

async function oauthLogin(provider){

  clearMessages();

  if(window.location.protocol === "file:"){

    showError(
      "Google/Facebook Login চালাতে HTML file সরাসরি খুলবেন না।\n\n" +
      "HTTPS hosting-এ site publish করতে হবে।"
    );

    return;
  }

  try{

    const result =
      await supabaseClient.auth.signInWithOAuth({

        provider:provider,

        options:{
          redirectTo:
            window.location.origin +
            window.location.pathname
        }

      });

    if(result.error){
      throw result.error;
    }

  }catch(error){

    showError(
      "OAuth Login failed:\n\n" +
      getErrorMessage(error)
    );
  }
}

    const result =
      await supabaseClient.auth
        .resetPasswordForEmail(

          email,

          {
            redirectTo:
              window.location.origin +
              window.location.pathname
          }

        );

    if(result.error){
      throw result.error;
    }

    showSuccess(
      "Password reset email পাঠানো হয়েছে/পাঠানোর চেষ্টা করা হয়েছে।\n\n" +
      "আপনার Gmail inbox এবং Spam folder check করুন।"
    );

  }catch(error){

    showError(
      "Password reset failed:\n\n" +
      getErrorMessage(error)
    );
  }
}

/* =========================================================
   AUTH STATE
========================================================= */

function setupAuthListener(){

  supabaseClient.auth.onAuthStateChange(
    async function(event,session){

      console.log(
        "AUTH EVENT:",
        event
      );

      if(event === "SIGNED_OUT"){

        currentUser = null;
        currentProfile = null;

        $("mainDashboard").style.display =
          "none";

        $("authLanding").style.display =
          "flex";

        return;
      }

      if(
        event === "SIGNED_IN" &&
        session
      ){

        currentUser =
          session.user;

        await loadProfile();

        showDashboard();
      }

    }
  );
}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

  if(!initSupabase()){
    return;
  }

  await checkSession();

  setupAuthListener();
}


/* =========================================================
   START
========================================================= */

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    startApp
  );

}else{

  startApp();
}

</script>
