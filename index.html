<!doctype html>

<html lang="bn">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TUINCOME v7</title>

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent

}

:root{

  --bg:#050b09;

  --bg2:#08130f;

  --card:#0d1c15;

  --card2:#102319;

  --green:#39ff88;

  --green2:#00d66b;

  --text:#ecfff4;

  --muted:#8ca99a;

  --border:#1b412e;

  --red:#ff5b6e;

  --gold:#ffd700;

}

html,body{

  margin:0;

  padding:0;

  min-height:100%;

  background:var(--bg);

  color:var(--text);

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif

}

body{

  padding-bottom:90px

}

button,input,select{

  font:inherit

}

button{

  cursor:pointer

}

header{

  height:72px;

  padding:15px 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#07150e;

  border-bottom:1px solid var(--border);

  position:sticky;

  top:0;

  z-index:10

}

.logo{

  color:var(--green);

  font-size:22px;

  font-weight:900;

  text-shadow:0 0 12px #39ff8870

}

.lang{

  border:1px solid #39ff8850;

  background:#0c2116;

  color:var(--green);

  border-radius:20px;

  padding:8px 14px

}

.auth-landing{

  min-height:calc(100vh - 72px);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px

}

.auth-card{

  width:min(430px,100%);

  padding:24px;

  border-radius:24px;

  background:linear-gradient(145deg,#0e2017,#07110c);

  border:1px solid var(--border);

  box-shadow:0 10px 35px #0008

}

.auth-card h2{

  text-align:center;

  margin:0 0 18px;

  color:var(--green)

}

.auth-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-bottom:18px

}

.auth-tab{

  border:1px solid var(--border);

  background:#08130e;

  color:#8fa99b;

  padding:11px;

  border-radius:12px;

  font-weight:800

}

.auth-tab.active{

  background:#103520;

  color:var(--green);

  border-color:#39ff8860

}

.social-btn{

  width:100%;

  padding:12px;

  margin-bottom:10px;

  border-radius:12px;

  background:#08130e;

  color:white;

  border:1px solid var(--border);

  font-weight:800

}

.google{

  color:#ff625b;

  border-color:#ff625b55

}

.facebook{

  color:#4b9cff;

  border-color:#4b9cff55

}

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  color:var(--muted);

  margin:17px 0

}

.divider:before,

.divider:after{

  content:"";

  height:1px;

  background:var(--border);

  flex:1

}

.form-group{

  margin-bottom:13px

}

.form-group label{

  display:block;

  margin-bottom:6px;

  color:#b9d1c2;

  font-size:13px

}

input,select{

  width:100%;

  padding:13px;

  border-radius:12px;

  border:1px solid var(--border);

  outline:none;

  background:#06100b;

  color:white

}

input:focus,select:focus{

  border-color:var(--green)

}

.primary{

  width:100%;

  padding:13px;

  border:0;

  border-radius:13px;

  background:linear-gradient(135deg,#39ff88,#00b95c);

  color:#031008;

  font-weight:900

}

.primary:disabled{

  opacity:.5

}

.error-box{

  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:12px;

  background:#3a1018;

  border:1px solid #ff526855;

  color:#ffb8c0;

  font-size:13px;

  line-height:1.5;

  text-align:left;

  white-space:pre-wrap;

  word-break:break-word

}

.success-box{

  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:12px;

  background:#0c321e;

  border:1px solid #39ff8855;

  color:#baffd1;

  font-size:13px;

  line-height:1.5

}

.small-note{

  margin-top:14px;

  color:#718a7c;

  font-size:11px;

  text-align:center;

  line-height:1.5

}

/* DASHBOARD */

#mainDashboard{

  display:none

}

.container{

  width:min(720px,100%);

  margin:auto;

  padding:15px 10px

}

.banner{

  padding:22px;

  border-radius:24px;

  background:

    radial-gradient(circle at top right,#1b6b3c55,transparent 50%),

    linear-gradient(135deg,#092719,#07120d);

  border:1px solid #1f5136;

  margin-bottom:14px

}

.banner small{

  color:var(--green);

  font-weight:800

}

.banner h1{

  margin:8px 0;

  font-size:26px

}

.banner p{

  margin:0;

  color:#9ab5a5;

  line-height:1.5

}

.balance-card{

  margin-top:16px;

  padding:20px;

  border-radius:20px;

  background:#07160e;

  border:1px solid #1b4b30

}

.balance-label{

  color:#86a292;

  font-size:13px

}

.balance{

  font-size:38px;

  font-weight:900;

  color:var(--green);

  margin-top:4px

}

.quick{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:9px;

  margin:14px 0

}

.quick-btn{

  min-height:82px;

  border-radius:16px;

  border:1px solid var(--border);

  background:#0a1811;

  color:white;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:7px

}

.quick-btn i{

  color:var(--green);

  font-size:21px

}

.quick-btn span{

  font-size:11px

}

.card{

  padding:17px;

  border-radius:20px;

  background:linear-gradient(145deg,#0d1c15,#09140f);

  border:1px solid var(--border);

  margin-bottom:13px

}

.card h3{

  margin:0 0 13px

}

.task-card{

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  margin-bottom:10px;

  border-radius:16px;

  background:#08150e;

  border:1px solid #183a28

}

.task-icon{

  width:45px;

  height:45px;

  border-radius:13px;

  background:#0e2c1b;

  display:grid;

  place-items:center;

  color:var(--green);

  flex-shrink:0

}

.task-info{

  flex:1

}

.task-info b{

  display:block;

  margin-bottom:4px

}

.task-info small{

  color:#718c7d

}

.task-reward{

  color:var(--green);

  font-weight:900

}

.task-btn{

  margin-top:7px;

  padding:8px 10px;

  border-radius:10px;

  border:1px solid #39ff8850;

  background:#143b24;

  color:var(--green);

  font-weight:800

}

.task-btn:disabled{

  opacity:.4

}

/* NAV */

.nav{

  position:fixed;

  left:50%;

  bottom:0;

  transform:translateX(-50%);

  width:min(720px,100%);

  height:76px;

  background:#07110c;

  border:1px solid var(--border);

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:15;

  border-radius:25px 25px 0 0

}

.nav button{

  border:0;

  background:none;

  color:#71887b;

  font-size:18px

}

.nav button span{

  display:block;

  font-size:10px;

  margin-top:4px

}

.nav button.active{

  color:var(--green)

}

.nav .go{

  width:58px;

  height:58px;

  border-radius:50%;

  background:linear-gradient(135deg,#48ff9a,#00a957);

  color:#031008;

  border:4px solid #07140d;

  margin-top:-28px

}

/* MODAL */

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:#000b;

  align-items:flex-end;

  justify-content:center

}

.sheet{

  width:min(720px,100%);

  max-height:90vh;

  overflow:auto;

  padding:22px;

  border-radius:27px 27px 0 0;

  background:#09150f;

  border:1px solid var(--border)

}

.close{

  float:right;

  width:35px;

  height:35px;

  border-radius:50%;

  border:1px solid var(--border);

  background:#0b1c13;

  color:white

}

.sheet h2{

  margin-top:0;

  color:var(--green)

}

.info-row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:12px 0;

  border-bottom:1px solid #173426

}

.info-row span:first-child{

  color:#789184

}

.history-item{

  padding:13px;

  border-radius:13px;

  background:#07120d;

  border:1px solid #173526;

  margin-bottom:9px

}

.pending{

  color:#ffd15c

}

.approved{

  color:var(--green)

}

.rejected{

  color:#ff6878

}

/* TASK MODAL */

.task-modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:#000d;

  align-items:center;

  justify-content:center;

  padding:20px

}

.task-box{

  width:min(400px,100%);

  padding:25px;

  border-radius:24px;

  text-align:center;

  background:#09170f;

  border:1px solid #235b39

}

.countdown{

  font-size:58px;

  font-weight:900;

  color:var(--green);

  margin:15px

}

.progress{

  height:7px;

  border-radius:10px;

  background:#183022;

  overflow:hidden;

  margin-bottom:18px

}

.progress div{

  height:100%;

  width:0;

  background:var(--green);

  transition:width 1s linear

}

@media(max-width:360px){

  .quick{

    grid-template-columns:repeat(2,1fr)

  }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =========================================================

   SUPABASE CONFIG

========================================================= */

const SUPABASE_URL =

"https://vtaojjjaekjijfziocay.supabase.co";

const SUPABASE_ANON_KEY =

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0YW9qamphZWtqaWpmemlvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTcwMDYsImV4cCI6MjEwMzQzMzAwNn0.9C1qpG41Z8tuwgYBO7LZKMP3LCYOzsgFNlhfqMUlues";

let supabaseClient = null;

let currentUser = null;

let currentProfile = null;

let authMode = "login";

let currentTask = null;

/* =========================================================

   HELPERS

========================================================= */

function $(id){

  return document.getElementById(id);

}

function showError(message){

  $("successBox").style.display = "none";

  $("errorBox").style.display = "block";

  $("errorBox").textContent = message;

}

function showSuccess(message){

  $("errorBox").style.display = "none";

  $("successBox").style.display = "block";

  $("successBox").textContent = message;

}

function clearMessages(){

  $("errorBox").style.display = "none";

  $("successBox").style.display = "none";

}

function getErrorMessage(error){

  if(!error){

    return "Unknown error";

  }

  let msg =

    error.message ||

    error.error_description ||

    String(error);

  if(

    msg.includes("Failed to fetch") ||

    msg.includes("Load failed") ||

    msg.includes("NetworkError")

  ){

    return (

      "Supabase server-এর সাথে কানেকশন হচ্ছে না।\n\n" +

      "সম্ভাব্য কারণ:\n" +

      "1. Internet connection সমস্যা\n" +

      "2. Supabase URL/Key ভুল\n" +

      "3. Supabase project বন্ধ/paused\n" +

      "4. Browser থেকে Supabase request block হচ্ছে\n\n" +

      "URL:\n" + SUPABASE_URL

    );

  }

  return msg;

}

/* =========================================================

   AUTH UI

========================================================= */

function setAuthMode(mode){

  authMode = mode;

  clearMessages();

  if(mode === "login"){

    $("authTitle").textContent = "লগইন করুন";

    $("loginTab").classList.add("active");

    $("registerTab").classList.remove("active");

    $("registerFields").style.display = "none";

    $("authBtn").textContent = "Login";

  }else{

    $("authTitle").textContent = "নতুন Account তৈরি করুন";

    $("registerTab").classList.add("active");

    $("loginTab").classList.remove("active");

    $("registerFields").style.display = "block";

    $("authBtn").textContent = "Register";

  }

}

/* =========================================================

   INIT SUPABASE

========================================================= */

function initSupabase(){

  if(!window.supabase){

    showError(

      "Supabase JavaScript library load হয়নি।\n\n" +

      "Internet চালু আছে কিনা দেখুন এবং আবার পেজটি খুলুন।"

    );

    return false;

  }

  try{

    supabaseClient =

      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY

      );

    return true;

  }catch(error){

    showError(

      "Supabase initialize করা যাচ্ছে না:\n\n" +

      getErrorMessage(error)

    );

    return false;

  }

}

/* =========================================================

   SUPABASE CONNECTION TEST

========================================================= */

async function testSupabase(){

  try{

    const controller =

      new AbortController();

    const timer =

      setTimeout(

        ()=>controller.abort(),

        10000

      );

    const response =

      await fetch(

        SUPABASE_URL + "/auth/v1/settings",

        {

          method:"GET",

          headers:{

            "apikey":SUPABASE_ANON_KEY

          },

          signal:controller.signal

        }

      );

    clearTimeout(timer);

    if(!response.ok){

      throw new Error(

        "Supabase response HTTP " +

        response.status

      );

    }

    return true;

  }catch(error){

    console.error("SUPABASE CONNECTION ERROR:",error);

    showError(

      "Supabase connection failed.\n\n" +

      getErrorMessage(error)

    );

    return false;

  }

}

/* =========================================================

   REGISTER

========================================================= */

async function registerUser(){

  clearMessages();

  const name =

    $("name").value.trim();

  const phone =

    $("phone").value.trim();

  const email =

    $("email").value.trim();

  const password =

    $("password").value;

  if(!name){

    showError("আপনার নাম দিন।");

    return;

  }

  if(!email){

    showError("Gmail / Email দিন।");

    return;

  }

  if(password.length < 6){

    showError("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");

    return;

  }

  $("authBtn").disabled = true;

  $("authBtn").textContent = "Register হচ্ছে...";

  try{

    const result =

      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{

          data:{

            full_name:name,

            phone:phone

          }

        }

      });

    if(result.error){

      throw result.error;

    }

    if(result.data.session){

      currentUser =

        result.data.user;

      await ensureProfile();

      showDashboard();

      showSuccess("Account তৈরি হয়েছে।");

    }else{

      showSuccess(

        "Registration সফল হয়েছে।\n\n" +

        "আপনার Gmail inbox-এ verification email পাঠানো হয়ে থাকলে সেটি verify করে Login করুন।"

      );

    }

  }catch(error){

    console.error(error);

    showError(

      "Registration failed:\n\n" +

      getErrorMessage(error)

    );

  }finally{

    $("authBtn").disabled = false;

    $("authBtn").textContent =

      "Register";

  }

}

/* =========================================================

   LOGIN

========================================================= */

async function loginUser(){

  clearMessages();

  const email =

    $("email").value.trim();

  const password =

    $("password").value;

  if(!email){

    showError("Email দিন।");

    return;

  }

  if(!password){

    showError("Password দিন।");

    return;

  }

/* =========================================================

   PROFILE

========================================================= */

async function ensureProfile(){

  if(!currentUser){

    return null;

  }

  try{

    const result =

      await supabaseClient

      .from("profiles")

      .select("*")

      .eq("id",currentUser.id)

      .maybeSingle();

    if(result.error){

      console.warn(

        "Profile read error:",

        result.error

      );

      currentProfile = {

        id:currentUser.id,

        full_name:

          currentUser.user_metadata?.full_name ||

          currentUser.email?.split("@")[0] ||

          "User",

        phone:

          currentUser.user_metadata?.phone ||

          "",

        balance:0

      };

      return currentProfile;

    }

    if(result.data){

      currentProfile =

        result.data;

      return currentProfile;

    }

    const newProfile = {

      id:currentUser.id,

      full_name:

        currentUser.user_metadata?.full_name ||

        currentUser.email?.split("@")[0] ||

        "User",

      phone:

        currentUser.user_metadata?.phone ||

        "",

      balance:0

    };

    const insertResult =

      await supabaseClient

      .from("profiles")

      .insert([newProfile])

      .select()

      .maybeSingle();

    if(insertResult.error){

      console.warn(

        "Profile create error:",

        insertResult.error

      );

      currentProfile =

        newProfile;

    }else{

      currentProfile =

        insertResult.data ||

        newProfile;

    }

    return currentProfile;

  }catch(error){

    console.warn(error);

    currentProfile = {

      id:currentUser.id,

      full_name:

        currentUser.user_metadata?.full_name ||

        "User",

      phone:

        currentUser.user_metadata?.phone ||

        "",

      balance:0

    };

    return currentProfile;

  }

}

async function loadTasks(){

  const grid =

    $("taskGrid");

  grid.innerHTML =

    '<div style="color:#789184">Task লোড হচ্ছে...</div>';

  try{

    const result =

      await supabaseClient

      .from("tasks")

      .select("*");

    if(result.error){

      throw result.error;

    }

    const tasks =

      (result.data || [])

      .filter(task =>

        task.active === undefined ||

        task.active === true

      );

    if(!tasks.length){

      grid.innerHTML =

        '<div style="color:#789184">এখন কোনো Task নেই।</div>';

      return;

    }

    grid.innerHTML = "";

    tasks.forEach(task => {

      const title =

        task.title ||

        "Task";

      const description =

        task.description ||

        "Task সম্পন্ন করুন";

      const reward =

        Number(task.reward || 0);

      const card =

        document.createElement("div");

      card.className =

        "task-card";

      card.innerHTML = `

        <div class="task-icon">

          <i class="fa-solid fa-bolt"></i>

        </div>

        <div class="task-info">

          <b>${escapeHTML(title)}</b>

          <small>

            ${escapeHTML(description)}

          </small>

          <br>

          <span class="task-reward">

            ৳${reward.toFixed(2)}

          </span>

          <br>

          <button class="task-btn">

            Start Task

          </button>

        </div>

      `;

      const button =

        card.querySelector(".task-btn");

      button.addEventListener(

        "click",

        () => startTask(task,button)

      );

      grid.appendChild(card);

    });

  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div style="

        color:#ff9ca8;

        padding:12px;

        background:#2b1017;

        border-radius:12px;

        line-height:1.5

      ">

        Task load failed.<br><br>

        ${escapeHTML(

          getErrorMessage(error)

        )}

      </div>

    `;

  }

}

/* =========================================================

   ESCAPE HTML

========================================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

/* =========================================================

   START TASK

========================================================= */

function startTask(task,button){

  if(!currentUser){

    alert("আগে Login করুন।");

    return;

  }

  if(button){

    button.disabled = true;

  }

  currentTask =

    task;

  $("taskTitle").textContent =

    task.title || "Task চলছে";

  $("countdown").textContent =

    "3";

  $("progressBar").style.width =

    "0%";

  $("rewardBtn").style.display =

    "none";

  $("taskModal").style.display =

    "flex";

  let count = 3;

  const interval =

    setInterval(() => {

      count--;

      $("countdown").textContent =

        count;

      $("progressBar").style.width =

        ((3-count)/3*100) + "%";

      if(count <= 0){

        clearInterval(interval);

        $("countdown").textContent =

          "✓";

        $("rewardBtn").style.display =

          "block";

      }

    },1000);

}

/* =========================================================

   CLAIM REWARD

========================================================= */

async function claimReward(){

  if(!currentUser || !currentTask){

    return;

  }

  const button =

    $("rewardBtn");

  button.disabled = true;

  button.textContent =

    "Saving...";

  try{

    const reward =

      Number(

        currentTask.reward || 0

      );

    /*

      IMPORTANT:

      Production app-এ reward server-side RPC/Edge Function

      দিয়ে দেওয়া উচিত। এই version শুধু আপনার বর্তমান

      client-side structure অনুযায়ী কাজ করবে।

    */

    const oldBalance =

      Number(

        currentProfile?.balance || 0

      );

    const newBalance =

      oldBalance + reward;

    const updateResult =

      await supabaseClient

      .from("profiles")

      .update({

        balance:newBalance

      })

      .eq("id",currentUser.id);

    if(updateResult.error){

      throw updateResult.error;

    }

    /*

      প্রথমে completed_tasks ব্যবহার করবে।

      আপনার database-এ যদি task_completions থাকে,

      নিচের fallback সেটিও চেষ্টা করবে।

    */

    let completion =

      await supabaseClient

      .from("completed_tasks")

      .insert([{

        user_id:currentUser.id,

        task_id:currentTask.id,

        reward:reward

      }]);

    if(completion.error){

      completion =

        await supabaseClient

        .from("task_completions")

        .insert([{

          user_id:currentUser.id,

          task_id:currentTask.id,

          reward:reward

        }]);

    }

    if(completion.error){

      console.warn(

        "Completion table error:",

        completion.error

      );

    }

    currentProfile.balance =

      newBalance;

    updateBalance();

    $("taskModal").style.display =

      "none";

    alert(

      "Task complete!\n\n" +

      "Reward: ৳" +

      reward.toFixed(2)

    );

  }catch(error){

    console.error(error);

    alert(

      "Reward save করতে সমস্যা:\n\n" +

      getErrorMessage(error)

    );

  }finally{

    button.disabled = false;

    button.textContent =

      "৳ Reward নিন";

  }

}

      .select("*")

      .eq("user_id",currentUser.id)

      .order("created_at",{ascending:false})

      .limit(20);

    if(!withdrawals.error){

      (withdrawals.data || [])

      .forEach(item => {

        html += `

        <div class="history-item">

          <b>Withdrawal</b><br>

          <br>

          Status:

          <span class="${statusClass(item.status)}">

            ${escapeHTML(item.status || "pending")}

          </span>

        `;

      });

  }catch(error){

      '<div style="color:#789184">কোনো history পাওয়া যায়নি।</div>';

  }

  $("sheetBody").innerHTML =

function statusClass(status){

  status =

    String(status || "")

    .toLowerCase();

  if(status === "approved" ||

     status === "completed"){

    return "approved";

  }

  if(status === "rejected"){

    return "rejected";

  }

  return "pending";

}

/* =========================================================

async function oauthLogin(provider){

  clearMessages();

  if(

    window.location.protocol === "file:"

  ){

    showError(

      "Google/Facebook Login চালাতে HTML file সরাসরি ফোনে খুলবেন না।\n\n" +

      "Site-টি HTTPS hosting-এ publish করতে হবে।"

    );

    return;

  }

  try{

    const result =

      await supabaseClient.auth.signInWithOAuth({

        provider:provider,

        options:{

          redirectTo:

            window.location.origin +

            window.location.pathname

        }

      });

    if(result.error){

      throw result.error;

    }

  }catch(error){

    showError(

      "OAuth Login failed:\n\n" +

      getErrorMessage(error)

    );

  }

}

      alert("এখন কোনো Task নেই।");

    }

  };

$("rewardBtn").onclick =

  claimReward;

$("langBtn").onclick =

  function(){

    alert(

      "Language option পরে যোগ করা যাবে।"

    );

  };

/* =========================================================

   AUTH STATE

========================================================= */

async function startApp(){

  if(!initSupabase()){

    return;

  }

  /*

    প্রথমে connection পরীক্ষা।

    Network error হলে এখন আর শুধু "Load failed"

    দেখাবে না—আসল কারণ দেখাবে।

  */

  const connected =

    await testSupabase();

  if(!connected){

    return;

  }

  supabaseClient.auth.onAuthStateChange(

    function(event,session){

      console.log(

        "AUTH EVENT:",

        event

      );

      if(event === "SIGNED_OUT"){

        currentUser = null;

        currentProfile = null;

        $("mainDashboard").style.display =

          "none";

        $("authLanding").style.display =

          "flex";

      }

    }

  );

  await checkSession();

}

/* =========================================================

   START

========================================================= */

document.addEventListener(

  "DOMContentLoaded",

  startApp

);

</script>
