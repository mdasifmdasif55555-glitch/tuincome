<!doctype html>

<html lang="bn">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TUINCOME v7</title>

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}

:root{

  --bg:#050b09;

  --bg2:#08130f;

  --card:#0d1c15;

  --card2:#102319;

  --green:#39ff88;

  --green2:#00d66b;

  --text:#ecfff4;

  --muted:#8ca99a;

  --border:#1b412e;

  --red:#ff5b6e;

  --gold:#ffd700;

  --yellow:#ffd15c;

}

html,body{

  margin:0;

  padding:0;

  min-height:100%;

  background:var(--bg);

  color:var(--text);

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

}

body{

  padding-bottom:90px;

}

button,input,select{

  font:inherit;

}

button{

  cursor:pointer;

}

button:disabled{

  opacity:.55;

  cursor:not-allowed;

}

header{

  height:72px;

  padding:15px 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#07150e;

  border-bottom:1px solid var(--border);

  position:sticky;

  top:0;

  z-index:10;

}

.logo{

  color:var(--green);

  font-size:22px;

  font-weight:900;

  text-shadow:0 0 12px #39ff8870;

}

.lang{

  border:1px solid #39ff8850;

  background:#0c2116;

  color:var(--green);

  border-radius:20px;

  padding:8px 14px;

}

.auth-landing{

  min-height:calc(100vh - 72px);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

}

.auth-card{

  width:min(430px,100%);

  padding:24px;

  border-radius:24px;

  background:linear-gradient(145deg,#0e2017,#07110c);

  border:1px solid var(--border);

  box-shadow:0 10px 35px #0008;

}

.auth-card h2{

  text-align:center;

  margin:0 0 18px;

  color:var(--green);

}

.auth-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-bottom:18px;

}

.auth-tab{

  border:1px solid var(--border);

  background:#08130e;

  color:#8fa99b;

  padding:11px;

  border-radius:12px;

  font-weight:800;

}

.auth-tab.active{

  background:#103520;

  color:var(--green);

  border-color:#39ff8860;

}

.social-btn{

  width:100%;

  padding:12px;

  margin-bottom:10px;

  border-radius:12px;

  background:#08130e;

  color:white;

  border:1px solid var(--border);

  font-weight:800;

}

.google{

  color:#ff625b;

  border-color:#ff625b55;

}

.facebook{

  color:#4b9cff;

  border-color:#4b9cff55;

}

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  color:var(--muted);

  margin:17px 0;

}

.divider:before,

.divider:after{

  content:"";

  height:1px;

  background:var(--border);

  flex:1;

}

.form-group{

  margin-bottom:13px;

}

.form-group label{

  display:block;

  margin-bottom:6px;

  color:#b9d1c2;

  font-size:13px;

}

input,select{

  width:100%;

  padding:13px;

  border-radius:12px;

  border:1px solid var(--border);

  outline:none;

  background:#06100b;

  color:white;

}

input:focus,select:focus{

  border-color:var(--green);

}

.primary{

  width:100%;

  padding:13px;

  border:0;

  border-radius:13px;

  background:linear-gradient(135deg,#39ff88,#00b95c);

  color:#031008;

  font-weight:900;

}

.secondary{

  width:100%;

  padding:12px;

  border-radius:12px;

  border:1px solid var(--border);

  background:#0b1d13;

  color:white;

  font-weight:800;

}

.danger{

  width:100%;

  padding:12px;

  border-radius:12px;

  border:1px solid #ff5b6e55;

  background:#351018;

  color:#ff9da8;

  font-weight:800;

}

.error-box,.success-box{

  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:12px;

  font-size:13px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;

}

.error-box{

  background:#3a1018;

  border:1px solid #ff526855;

  color:#ffb8c0;

}

.success-box{

  background:#0c321e;

  border:1px solid #39ff8855;

  color:#baffd1;

}

.small-note{

  margin-top:14px;

  color:#718a7c;

  font-size:11px;

  text-align:center;

  line-height:1.5;

}

#mainDashboard{

  display:none;

}

.container{

  width:min(720px,100%);

  margin:auto;

  padding:15px 10px;

}

.banner{

  padding:22px;

  border-radius:24px;

  background:

    radial-gradient(circle at top right,#1b6b3c55,transparent 50%),

    linear-gradient(135deg,#092719,#07120d);

  border:1px solid #1f5136;

  margin-bottom:14px;

}

.banner small{

  color:var(--green);

  font-weight:800;

}

.banner h1{

  margin:8px 0;

  font-size:26px;

}

.banner p{

  margin:0;

  color:#9ab5a5;

  line-height:1.5;

}

.balance-card{

  margin-top:16px;

  padding:20px;

  border-radius:20px;

  background:#07160e;

  border:1px solid #1b4b30;

}

.balance-label{

  color:#86a292;

  font-size:13px;

}

.balance{

  font-size:38px;

  font-weight:900;

  color:var(--green);

  margin-top:4px;

}

.quick{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:9px;

  margin:14px 0;

}

.quick-btn{

  min-height:82px;

  border-radius:16px;

  border:1px solid var(--border);

  background:#0a1811;

  color:white;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:7px;

}

.quick-btn i{

  color:var(--green);

  font-size:21px;

}

.quick-btn span{

  font-size:11px;

}

.card{

  padding:17px;

  border-radius:20px;

  background:linear-gradient(145deg,#0d1c15,#09140f);

  border:1px solid var(--border);

  margin-bottom:13px;

}

.card h3{

  margin:0 0 13px;

}

.task-card{

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  margin-bottom:10px;

  border-radius:16px;

  background:#08150e;

  border:1px solid #183a28;

}

.task-icon{

  width:45px;

  height:45px;

  border-radius:13px;

  background:#0e2c1b;

  display:grid;

  place-items:center;

  color:var(--green);

  flex-shrink:0;

}

.task-info{

  flex:1;

  min-width:0;

}

.task-info b{

  display:block;

  margin-bottom:4px;

}

.task-info small{

  color:#718c7d;

}

.task-reward{

  color:var(--green);

  font-weight:900;

}

.task-btn{

  margin-top:7px;

  padding:8px 10px;

  border-radius:10px;

  border:1px solid #39ff8850;

  background:#143b24;

  color:var(--green);

  font-weight:800;

}

.nav{

  position:fixed;

  left:50%;

  bottom:0;

  transform:translateX(-50%);

  width:min(720px,100%);

  height:76px;

  background:#07110c;

  border:1px solid var(--border);

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:15;

  border-radius:25px 25px 0 0;

}

.nav button{

  border:0;

  background:none;

  color:#71887b;

  font-size:18px;

}

.nav button span{

  display:block;

  font-size:10px;

  margin-top:4px;

}

.nav button.active{

  color:var(--green);

}

.nav .go{

  width:58px;

  height:58px;

  border-radius:50%;

  background:linear-gradient(135deg,#48ff9a,#00a957);

  color:#031008;

  border:4px solid #07140d;

  margin-top:-28px;

}

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  background:#000b;

  align-items:flex-end;

  justify-content:center;

}

.sheet{

  width:min(720px,100%);

  max-height:90vh;

  overflow:auto;

  padding:22px;

  border-radius:27px 27px 0 0;

  background:#09150f;

  border:1px solid var(--border);

}

.close{

  float:right;

  width:35px;

  height:35px;

  border-radius:50%;

  border:1px solid var(--border);

  background:#0b1c13;

  color:white;

  font-size:22px;

}

.sheet h2{

  margin-top:0;

  color:var(--green);

}

.info-row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:12px 0;

  border-bottom:1px solid #173426;

}

.info-row span:first-child{

  color:#789184;

}

.history-item{

  padding:13px;

  border-radius:13px;

  background:#07120d;

  border:1px solid #173526;

  margin-bottom:9px;

}

.pending{

  color:#ffd15c;

}

.approved{

  color:var(--green);

}

.rejected{

  color:#ff6878;

}

.task-modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:#000d;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.task-box{

  width:min(400px,100%);

  padding:25px;

  border-radius:24px;

  text-align:center;

  background:#09170f;

  border:1px solid #235b39;

}

.countdown{

  font-size:58px;

  font-weight:900;

  color:var(--green);

  margin:15px;

}

.progress{

  height:7px;

  border-radius:10px;

  background:#183022;

  overflow:hidden;

  margin-bottom:18px;

}

.progress div{

  height:100%;

  width:0;

  background:var(--green);

  transition:width 1s linear;

}

.loading,.empty{

  color:#789184;

  text-align:center;

  padding:15px;

}

.admin-stat{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

  margin-bottom:12px;

}

.stat-box{

  padding:15px;

  border-radius:15px;

  background:#07150e;

  border:1px solid var(--border);

}

.stat-box small{

  color:var(--muted);

}

.stat-box b{

  display:block;

  margin-top:5px;

  font-size:22px;

  color:var(--green);

}

.admin-item{

  padding:14px;

  border:1px solid var(--border);

  background:#07140e;

  border-radius:15px;

  margin-bottom:10px;

}

.admin-actions{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:10px;

}

.admin-actions button{

  padding:9px;

  border-radius:10px;

  border:1px solid var(--border);

  background:#10251a;

  color:white;

}

.approve{

  color:var(--green)!important;

}

.reject{

  color:#ff7d8c!important;

}

.gold{

  color:var(--gold);

}

.badge{

  display:inline-block;

  padding:4px 8px;

  border-radius:20px;

  background:#153521;

  color:var(--green);

  font-size:11px;

}

@media(max-width:360px){

  .quick{

    grid-template-columns:repeat(2,1fr);

  }

}

</style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =========================================================

   SUPABASE

========================================================= */

const SUPABASE_URL =

"https://hgribbrofuqtfboaitgi.supabase.co";

const SUPABASE_ANON_KEY =

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmliYnJvZnVxdGZib2FpdGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzMyMjUsImV4cCI6MjEwMzE0OTIyNX0.VPFZ_jKsYDNO084W8qxkqYraY47iwiRGnQC6THLn-s8";

const sb =

window.supabase.createClient(

SUPABASE_URL,

SUPABASE_ANON_KEY

);

let currentUser=null;

let currentProfile=null;

let currentTask=null;

let taskTimer=null;

let authMode="login";

let authListenerStarted=false;

/* =========================================================

   HELPERS

========================================================= */

const $=id=>document.getElementById(id);

function esc(v){

return String(v??"")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

function money(v){

return Number(v||0).toFixed(2);

}

function errorText(e){

return e?.message || e?.error_description || String(e);

}

function statusClass(s){

s=String(s||"").toLowerCase();

if(s==="approved"||s==="completed")return"approved";

if(s==="rejected")return"rejected";

return"pending";

}

function showError(t){

$("successBox").style.display="none";

$("errorBox").style.display="block";

$("errorBox").textContent=t;

}

function showSuccess(t){

$("errorBox").style.display="none";

$("successBox").style.display="block";

$("successBox").textContent=t;

}

function clearMessages(){

$("errorBox").style.display="none";

$("successBox").style.display="none";

}

/* =========================================================

   AUTH MODE

========================================================= */

function setAuthMode(mode){

authMode=mode;

clearMessages();

if(mode==="login"){

$("authTitle").textContent="লগইন করুন";

$("loginTab").classList.add("active");

$("registerTab").classList.remove("active");

$("registerFields").style.display="none";

$("authBtn").textContent="Login";

}else{

$("authTitle").textContent="নতুন Account তৈরি করুন";

$("registerTab").classList.add("active");

$("loginTab").classList.remove("active");

$("registerFields").style.display="block";

$("authBtn").textContent="Register";

}

}

/* =========================================================

   PROFILE

========================================================= */

async function loadProfile(){

if(!currentUser)throw new Error("LOGIN_REQUIRED");

const {data,error}=await sb

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.maybeSingle();

if(error)throw error;

if(!data)throw new Error("PROFILE_NOT_FOUND");

currentProfile=data;

currentProfile.balance=Number(data.balance||0);

return data;

}

async function refreshProfile(){

if(!currentUser)return;

try{

await loadProfile();

updateDashboard();

}catch(e){

console.error(e);

}

}

function updateDashboard(){

$("balance").textContent=

money(currentProfile?.balance);

$("welcomeName").textContent=

currentProfile?.full_name ||

currentUser?.user_metadata?.full_name ||

currentUser?.email?.split("@")[0] ||

"User";

}

/* =========================================================

   REGISTER

========================================================= */

async function registerUser(){

clearMessages();

const name=$("name").value.trim();

const phone=$("phone").value.trim();

const email=$("email").value.trim();

const password=$("password").value;

if(!name){

showError("আপনার নাম দিন।");

return;

}

if(phone&&!/^01[0-9]{9}$/.test(phone)){

showError("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।");

return;

}

if(!email){

showError("Email দিন।");

return;

}

if(password.length<6){

showError("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");

return;

}

$("authBtn").disabled=true;

$("authBtn").textContent="Register হচ্ছে...";

try{

const {data,error}=await sb.auth.signUp({

email,

password,

options:{

data:{

full_name:name,

phone:phone

}

}

});

if(error)throw error;

if(data.session){

currentUser=data.user;

await loadProfile();

showDashboard();

}else{

showSuccess(

"Registration সফল হয়েছে।\n\n"+

"Gmail inbox-এ verification email এলে Email Verify করে Login করুন।"

);

}

}catch(e){

showError("Registration failed:\n\n"+errorText(e));

}finally{

$("authBtn").disabled=false;

$("authBtn").textContent="Register";

}

}

/* =========================================================

   LOGIN

========================================================= */

async function loginUser(){

clearMessages();

const email=$("email").value.trim();

const password=$("password").value;

if(!email){

showError("Email দিন।");

return;

}

if(!password){

showError("Password দিন।");

return;

/* =========================================================

   TASK START

========================================================= */

function startTask(task){

if(!currentUser){

alert("আগে Login করুন।");

return;

}

if(taskTimer)clearInterval(taskTimer);

currentTask=task;

$("taskTitle").textContent=

task.title||"Task চলছে";

$("countdown").textContent="3";

$("progressBar").style.width="0%";

$("rewardBtn").style.display="none";

$("taskModal").style.display="flex";

let n=3;

taskTimer=setInterval(()=>{

n--;

$("countdown").textContent=n;

$("progressBar").style.width=

((3-n)/3*100)+"%";

if(n<=0){

clearInterval(taskTimer);

taskTimer=null;

$("countdown").textContent="✓";

$("rewardBtn").style.display="block";

}

},1000);

}

/* =========================================================

========================================================= */

async function adminDeposit(id,status){

if(!isAdmin())return;

if(!confirm(

status==="approved"

?"Deposit Approve করবেন?"

:"Deposit Reject করবেন?"

))return;

try{

const rpc=

status==="approved"

?"admin_approve_deposit"

:"admin_reject_deposit";

/* =========================================================

async function adminAddTask(){

const title=$("adminTaskTitle").value.trim();

const description=$("adminTaskDescription").value.trim();

const reward=Number($("adminTaskReward").value);

if(!title||!Number.isFinite(reward)||reward<=0){

alert("Task title এবং সঠিক reward দিন।");

return;

}

try{

const {error}=await sb

.from("tasks")

.insert({

title,

description,

reward,

active:true,

max_completions:1

});

alert("Task যোগ হয়েছে।");

await loadAdminPanel();

}catch(e){

alert("Task add failed:\n\n"+errorText(e));

}

}

/* =========================================================

   SHEET

========================================================= */

function openSheet(title,body){

$("sheetTitle").textContent=title;

$("sheetBody").innerHTML=body;

$("modal").style.display="flex";

}

function closeModal(){

$("modal").style.display="none";

}

/* =========================================================

   LOGOUT

========================================================= */

async function logoutUser(){

await sb.auth.signOut();

currentUser=null;

currentProfile=null;

$("mainDashboard").style.display="none";

$("authLanding").style.display="flex";

closeModal();

setAuthMode("login");

}

/* =========================================================

   OAUTH

========================================================= */

async function oauthLogin(provider){

try{

const {error}=await sb.auth.signInWithOAuth({

provider,

options:{

redirectTo:

window.location.origin+

window.location.pathname

}

});

if(error)throw error;

}catch(e){

showError(

"OAuth Login failed:\n\n"+

errorText(e)

);

}

}

/* =========================================================

   PASSWORD RESET

========================================================= */

async function resetPassword(){

const email=$("email").value.trim();

if(!email){

showError("আগে Email লিখুন।");

return;

}

try{

const {error}=await sb.auth.resetPasswordForEmail(

email,

{

redirectTo:

window.location.origin+

window.location.pathname

}

);

if(error)throw error;

showSuccess(

"Password reset email পাঠানো হয়েছে। Gmail inbox এবং Spam folder check করুন।"

);

}catch(e){

showError(

"Password reset failed:\n\n"+

errorText(e)

);

}

}

/* =========================================================

   AUTH LISTENER

========================================================= */

function setupAuthListener(){

if(authListenerStarted)return;

authListenerStarted=true;

sb.auth.onAuthStateChange(

async(event,session)=>{

if(event==="SIGNED_OUT"){

currentUser=null;

currentProfile=null;

$("mainDashboard").style.display="none";

$("authLanding").style.display="flex";

return;

}

if(

(event==="SIGNED_IN"||event==="TOKEN_REFRESHED")&&

session

){

try{

currentUser=session.user;

await loadProfile();

showDashboard();

}catch(e){

console.error(e);

}

}

});

}
