<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUINCOME - Earn Money Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #060e0a;
      --card-bg: #0d1f16;
      --green: #00ff88;
      --red: #ff4d4d;
      --text: #ffffff;
      --muted: #8ca99a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    .container { max-width: 480px; margin: 0 auto; padding: 15px; }

    /* Header Profile Card */
    .profile-card {
      background: linear-gradient(135deg, #0d1f16 0%, #153826 100%);
      border: 1px solid #1a3a28;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.05);
    }
    .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .avatar { width: 50px; height: 50px; background: var(--green); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    .user-details h3 { font-size: 18px; color: var(--text); }
    .user-id-badge {
      display: inline-block;
      background: rgba(0, 255, 136, 0.15);
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
      font-family: monospace;
    }

    .balance-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .balance-title { font-size: 12px; color: var(--muted); }
    .balance-amount { font-size: 22px; font-weight: bold; color: var(--green); }

    /* Action Buttons */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      background: var(--card-bg);
      border: 1px solid #1a3a28;
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action.primary { background: var(--green); color: #000; }

    /* Form Card */
    .card {
      background: var(--card-bg);
      border: 1px solid #1a3a28;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      display: none;
    }
    .card.active { display: block; }
    .card-title { font-size: 16px; color: var(--green); margin-bottom: 12px; }

    input, select {
      width: 100%;
      padding: 12px;
      background: #060e0a;
      border: 1px solid #1a3a28;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 12px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Auth Box */
    #authCard { display: block; }
  </style>
</head>
<body>

  <div class="container">

    <!-- AUTH SECTION (Login / Register) -->
    <div id="authCard" class="card active">
      <h2 class="card-title"><i class="fa-solid fa-right-to-bracket"></i> অ্যাকাউন্ট লগইন / রেজিস্টার</h2>
      <input type="email" id="authEmail" placeholder="আপনার ইমেইল দিন">
      <input type="password" id="authPass" placeholder="পাসওয়ার্ড দিন">
      <button class="btn-submit" id="btnLogin">লগইন করুন</button>
      <button class="btn-action" id="btnRegister" style="width: 100%; margin-top: 8px;">নতুন অ্যাকাউন্ট খুলুন</button>
    </div>

    <!-- MAIN APP CONTENT (Logined Users) -->
    <div id="mainApp" style="display: none;">
      
      <!-- Profile & Balance Header -->
      <div class="profile-card">
        <div class="user-info">
          <div class="avatar" id="userAvatar"><i class="fa-solid fa-user"></i></div>
          <div class="user-details">
            <h3 id="userEmailDisplay">User</h3>
            <div class="user-id-badge"><i class="fa-solid fa-id-card"></i> <span id="displayUserId">TU-XXXXXX</span></div>
          </div>
        </div>
        <div class="balance-box">
          <div>
            <div class="balance-title">বর্তমান ব্যালেন্স</div>
            <div class="balance-amount" id="userBalance">৳ 0.00</div>
          </div>
          <button class="btn-action" id="btnRefreshBal"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-grid">
        <button class="btn-action primary" id="showDepositBtn"><i class="fa-solid fa-plus-circle"></i> ডিপোজিট</button>
        <button class="btn-action" id="showWithdrawBtn"><i class="fa-solid fa-minus-circle"></i> উইথড্র</button>
      </div>

      <!-- DEPOSIT FORM -->
      <div id="depositCard" class="card">
        <h3 class="card-title"><i class="fa-solid fa-money-bill-wave"></i> টাকা জমা দিন (Deposit)</h3>
        <p style="font-size: 12px; color: var(--muted); margin-bottom: 10px;">আমাদের বিকাশ/নগদ নম্বর: <b>01700000000</b> (Personal)</p>
        <input type="number" id="depositAmount" placeholder="টাকার পরিমাণ (যেমন: 500)">
        <input type="text" id="depositTrx" placeholder="Transaction ID (TrxID)">
        <button class="btn-submit" id="btnSubmitDeposit">ডিপোজিট রিকোয়েস্ট পাঠান</button>
      </div>

      <!-- WITHDRAW FORM -->
      <div id="withdrawCard" class="card">
        <h3 class="card-title"><i class="fa-solid fa-hand-holding-dollar"></i> টাকা তুলুন (Withdraw)</h3>
        <select id="withdrawMethod">
          <option value="bKash">বিকাশ (bKash)</option>
          <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="text" id="withdrawPhone" placeholder="বিকাশ/নগদ নম্বর">
        <input type="number" id="withdrawAmount" placeholder="উইথড্র পরিমাণ">
        <button class="btn-submit" id="btnSubmitWithdraw">উইথড্র রিকোয়েস্ট পাঠান</button>
      </div>

      <button class="btn-action" id="btnLogout" style="width:100%; color:var(--red); border-color:var(--red); margin-top: 20px;">
        <i class="fa-solid fa-right-from-bracket"></i> লগআউট
      </button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = "https://vtaojjjaekjijfziocay.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0YW9qamphZWtqaWpmemlvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTcwMDYsImV4cCI6MjEwMzQzMzAwNn0.9C1qpG41Z8tuwgYBO7LZKMP3LCYOzsgFNlhfqMUlues";

    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var currentUser = null;

    // Helper: Generate Short User ID
    function getShortId(fullId) {
      if(!fullId) return "TU-000000";
      return "TU-" + fullId.substring(0, 8).toUpperCase();
    }

    // Check Login State
    supabaseClient.auth.getSession().then(function(res) {
      if (res.data && res.data.session) {
        currentUser = res.data.session.user;
        showApp();
      }
    });

    // Auth Functions
    document.getElementById("btnLogin").onclick = function() {
      var email = document.getElementById("authEmail").value.trim();
      var pass = document.getElementById("authPass").value;
      if (!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");

      supabaseClient.auth.signInWithPassword({ email: email, password: pass }).then(function(res) {
        if (res.error) alert("লগইন ব্যর্থ: " + res.error.message);
        else {
          currentUser = res.data.user;
          showApp();
        }
      });
    };

    document.getElementById("btnRegister").onclick = function() {
      var email = document.getElementById("authEmail").value.trim();
      var pass = document.getElementById("authPass").value;
      if (!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");

      supabaseClient.auth.signUp({ email: email, password: pass }).then(function(res) {
        if (res.error) alert("রেজিস্ট্রেশন ব্যর্থ: " + res.error.message);
        else {
          alert("অ্যালাউড! অনুগ্রহ করে আপনার ইমেইল চেক করুন অথবা লগইন করুন।");
          currentUser = res.data.user;
          if (currentUser) {
            // Create initial profile
            supabaseClient.from("profiles").insert([{ id: currentUser.id, email: email, balance: 0 }]).then(function() {
              showApp();
            });
          }
        }
      });
    };

    document.getElementById("btnLogout").onclick = function() {
      supabaseClient.auth.signOut().then(function() {
        location.reload();
      });
    };

    function showApp() {
      document.getElementById("authCard").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("userEmailDisplay").innerText = currentUser.email;
      
      // Show Short User ID
      document.getElementById("displayUserId").innerText = getShortId(currentUser.id);
      
      loadUserData();
    }

    function loadUserData() {
      supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single().then(function(res) {
        if (res.data) {
          document.getElementById("userBalance").innerText = "৳ " + Number(res.data.balance || 0).toFixed(2);
        } else {
          // If profile missing, create profile
          supabaseClient.from("profiles").insert([{ id: currentUser.id, email: currentUser.email, balance: 0 }]).then(function() {
            loadUserData();
          });
        }
      });
    }

    document.getElementById("btnRefreshBal").onclick = loadUserData;

    // Toggle Forms
    document.getElementById("showDepositBtn").onclick = function() {
      document.getElementById("depositCard").classList.toggle("active");
      document.getElementById("withdrawCard").classList.remove("active");
    };

    document.getElementById("showWithdrawBtn").onclick = function() {
      document.getElementById("withdrawCard").classList.toggle("active");
      document.getElementById("depositCard").classList.remove("active");
    };

    // Deposit Request
    document.getElementById("btnSubmitDeposit").onclick = function() {
      var amount = Number(document.getElementById("depositAmount").value);
      var trx = document.getElementById("depositTrx").value.trim();

      if (!amount || !trx) return alert("পরিমাণ এবং Transaction ID দিন");

      supabaseClient.from("deposits").insert([{
        user_id: currentUser.id,
        amount: amount,
        transaction_id: trx,
        status: "pending"
      }]).then(function(res) {
        if (res.error) alert("ব্যর্থ: " + res.error.message);
        else {
          alert("ডিপোজিট রিকোয়েস্ট জমা হয়েছে! এডমিন যাচাই করে এপ্রুভ করবেন।");
          document.getElementById("depositAmount").value = "";
          document.getElementById("depositTrx").value = "";
          document.getElementById("depositCard").classList.remove("active");
        }
      });
    };

    // Withdraw Request
    document.getElementById("btnSubmitWithdraw").onclick = function() {
      var method = document.getElementById("withdrawMethod").value;
      var phone = document.getElementById("withdrawPhone").value.trim();
      var amount = Number(document.getElementById("withdrawAmount").value);

      if (!phone || !amount) return alert("নম্বর এবং টাকার পরিমাণ দিন");

      // Check user balance first
      supabaseClient.from("profiles").select("balance").eq("id", currentUser.id).single().then(function(res) {
        var currentBal = Number(res.data ? res.data.balance : 0);
        if (currentBal < amount) return alert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");

        // Deduct temporarily or pending
        var newBal = currentBal - amount;
        supabaseClient.from("profiles").update({ balance: newBal }).eq("id", currentUser.id).then(function() {
          supabaseClient.from("withdrawals").insert([{
            user_id: currentUser.id,
            amount: amount,
            method: method,
            phone_number: phone,
            status: "pending"
          }]).then(function(wRes) {
            if (wRes.error) alert("ব্যর্থ: " + wRes.error.message);
            else {
              alert("উইথড্র রিকোয়েস্ট সফল হয়েছে!");
              document.getElementById("withdrawPhone").value = "";
              document.getElementById("withdrawAmount").value = "";
              document.getElementById("withdrawCard").classList.remove("active");
              loadUserData();
            }
          });
        });
      });
    };
  </script>
</body>
</html>
