<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUINCOME - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #060e0a;
      --card-bg: #0d1f16;
      --green: #00ff88;
      --red: #ff4d4d;
      --muted: #8ca99a;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: var(--green); text-align: center; margin-bottom: 20px; }
    
    .section-card {
      background: var(--card-bg);
      border: 1px solid #1a3a28;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 18px;
      color: var(--green);
      margin-bottom: 15px;
      border-bottom: 1px solid #1a3a28;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Form inputs */
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #060e0a;
      border: 1px solid #1a3a28;
      border-radius: 6px;
      color: #fff;
    }
    
    /* Buttons */
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-refresh { background: #1a3a28; color: var(--green); font-size: 12px; }

    /* Tables */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1a3a28; }
    th { color: var(--muted); background: #060e0a; }
    tr:hover { background: rgba(0, 255, 136, 0.03); }
    
    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-pending { background: #ffd700; color: #000; }
    .badge-approved { background: var(--green); color: #000; }
    .badge-rejected { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fa-solid fa-user-shield"></i> Admin Panel</h1>

    <!-- 1. DIRECT BALANCE ADD / DEDUCT -->
    <div class="section-card">
      <div class="section-title">
        <span><i class="fa-solid fa-wallet"></i> ইউজার ব্যালেন্স কন্ট্রোল (টাকা যোগ/বিয়োগ)</span>
      </div>
      <div class="grid-form">
        <div>
          <label style="font-size:12px; color:var(--muted);">ইউজার ID বা Email</label>
          <input type="text" id="targetUser" placeholder="User ID অথবা Email দিন">
        </div>
        <div>
          <label style="font-size:12px; color:var(--muted);">টাকার পরিমাণ (Amount)</label>
          <input type="number" id="balanceAmount" placeholder="যেমন: 500">
        </div>
        <div>
          <label style="font-size:12px; color:var(--muted);">অ্যাকশন টাইপ</label>
          <select id="actionType">
            <option value="add">যোগ করুন (+)</option>
            <option value="subtract">বিয়োগ করুন (-)</option>
          </select>
        </div>
      </div>
      <button class="btn-green" id="btnUpdateBalance">ব্যালেন্স আপডেট করুন</button>
    </div>

    <!-- 2. PENDING DEPOSITS -->
    <div class="section-card">
      <div class="section-title">
        <span><i class="fa-solid fa-money-bill-wave"></i> ডিপোজিট রিকোয়েস্টসমূহ</span>
        <button class="btn-refresh" id="btnRefreshDeposits"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ইউজার ID</th>
              <th>পরিমাণ</th>
              <th>Trx ID</th>
              <th>স্ট্যাটাস</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="depositTableBody">
            <tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. PENDING WITHDRAWALS -->
    <div class="section-card">
      <div class="section-title">
        <span><i class="fa-solid fa-hand-holding-dollar"></i> উইথড্র রিকোয়েস্টসমূহ</span>
        <button class="btn-refresh" id="btnRefreshWithdraws"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ইউজার ID</th>
              <th>পরিমাণ</th>
              <th>মেথড ও নম্বর</th>
              <th>স্ট্যাটাস</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="withdrawTableBody">
            <tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 4. PENDING VIP PURCHASES -->
    <div class="section-card">
      <div class="section-title">
        <span><i class="fa-solid fa-crown"></i> VIP প্যাকেজ রিকোয়েস্টসমূহ</span>
        <button class="btn-refresh" id="btnRefreshVip"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ইউজার ID</th>
              <th>প্যাকেজ ID</th>
              <th>মূল্য</th>
              <th>স্ট্যাটাস</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="vipTableBody">
            <tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = "https://vtaojjjaekjijfziocay.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0YW9qamphZWtqaWpmemlvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTcwMDYsImV4cCI6MjEwMzQzMzAwNn0.9C1qpG41Z8tuwgYBO7LZKMP3LCYOzsgFNlhfqMUlues";

    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. MANUALLY UPDATE USER BALANCE
    document.getElementById("btnUpdateBalance").onclick = function() {
      var target = document.getElementById("targetUser").value.trim();
      var amount = Number(document.getElementById("balanceAmount").value);
      var type = document.getElementById("actionType").value;

      if (!target || !amount) {
        alert("ইউজার ID/Email এবং Amount প্রদান করুন।");
        return;
      }

      // Find user
      var query = supabaseClient.from("profiles").select("*");
      if (target.includes("@")) query = query.eq("email", target);
      else query = query.eq("id", target);

      query.single().then(function(res) {
        if (res.error || !res.data) {
          alert("ইউজার পাওয়া যায়নি!");
          return;
        }

        var user = res.data;
        var currentBal = Number(user.balance || 0);
        var newBal = type === "add" ? (currentBal + amount) : (currentBal - amount);

        supabaseClient.from("profiles").update({ balance: newBal }).eq("id", user.id).then(function(uRes) {
          if (uRes.error) alert("ব্যালেন্স আপডেট ব্যর্থ: " + uRes.error.message);
          else alert("সফল হয়েছে! বর্তমান ব্যালেন্স: ৳" + newBal.toFixed(2));
        });
      });
    };

    // 2. LOAD & HANDLE DEPOSITS
    function loadDeposits() {
      var tbody = document.getElementById("depositTableBody");
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>';

      supabaseClient.from("deposits").select("*").order("created_at", { ascending: false }).then(function(res) {
        if (res.error || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো ডিপোজিট রেকর্ড নেই।</td></tr>';
          return;
        }

        var html = "";
        res.data.forEach(function(item) {
          var isPending = item.status === "pending";
          html += '<tr>' +
            '<td><small>' + item.user_id + '</small></td>' +
            '<td><b>৳' + item.amount + '</b></td>' +
            '<td>' + (item.transaction_id || 'N/A') + '</td>' +
            '<td><span class="badge badge-' + (item.status || 'pending') + '">' + (item.status || 'pending') + '</span></td>' +
            '<td>' +
              (isPending ? 
                '<button class="btn-green" onclick="approveDeposit(\'' + item.id + '\', \'' + item.user_id + '\', ' + item.amount + ')">Approve</button> ' +
                '<button class="btn-red" onclick="rejectDeposit(\'' + item.id + '\')">Reject</button>' 
                : 'সম্পন্ন') +
            '</td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      });
    }

    window.approveDeposit = function(depId, userId, amount) {
      if (!confirm("আপনি কি এই ৳" + amount + " ডিপোজিট এপ্রুভ করতে চান?")) return;

      supabaseClient.from("deposits").update({ status: "approved" }).eq("id", depId).then(function(res) {
        if (res.error) return alert(res.error.message);

        // Add balance to user
        supabaseClient.from("profiles").select("balance").eq("id", userId).single().then(function(pRes) {
          var currentBal = Number(pRes.data ? pRes.data.balance : 0);
          var newBal = currentBal + Number(amount);

          supabaseClient.from("profiles").update({ balance: newBal }).eq("id", userId).then(function() {
            alert("ডিপোজিট এপ্রুভ হয়েছে এবং ইউজারের ব্যালেন্সে টাকা যুক্ত হয়েছে!");
            loadDeposits();
          });
        });
      });
    };

    window.rejectDeposit = function(depId) {
      if (!confirm("আপনি কি এই ডিপোজিট রিজেক্ট করতে চান?")) return;
      supabaseClient.from("deposits").update({ status: "rejected" }).eq("id", depId).then(function() {
        alert("ডিপোজিট রিজেক্ট করা হয়েছে।");
        loadDeposits();
      });
    };

    // 3. LOAD & HANDLE WITHDRAWALS
    function loadWithdrawals() {
      var tbody = document.getElementById("withdrawTableBody");
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>';

      supabaseClient.from("withdrawals").select("*").order("created_at", { ascending: false }).then(function(res) {
        if (res.error || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো উইথড্র রেকর্ড নেই।</td></tr>';
          return;
        }

        var html = "";
        res.data.forEach(function(item) {
          var isPending = item.status === "pending";
          html += '<tr>' +
            '<td><small>' + item.user_id + '</small></td>' +
            '<td><b>৳' + item.amount + '</b></td>' +
            '<td>' + item.method + ' (' + item.phone_number + ')</td>' +
            '<td><span class="badge badge-' + (item.status || 'pending') + '">' + (item.status || 'pending') + '</span></td>' +
            '<td>' +
              (isPending ? 
                '<button class="btn-green" onclick="approveWithdraw(\'' + item.id + '\')">Approve</button> ' +
                '<button class="btn-red" onclick="rejectWithdraw(\'' + item.id + '\', \'' + item.user_id + '\', ' + item.amount + ')">Reject</button>' 
                : 'সম্পন্ন') +
            '</td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      });
    }

    window.approveWithdraw = function(wdId) {
      if (!confirm("আপনি কি পেমেন্ট পাঠিয়েছেন এবং এটি এপ্রুভ করতে চান?")) return;
      supabaseClient.from("withdrawals").update({ status: "approved" }).eq("id", wdId).then(function() {
        alert("উইথড্র এপ্রুভ করা হয়েছে!");
        loadWithdrawals();
      });
    };

    window.rejectWithdraw = function(wdId, userId, amount) {
      if (!confirm("উইথড্র রিজেক্ট করলে টাকা ইউজারের অ্যাকাউন্টে ফেরত যাবে। রিজেক্ট করবেন?")) return;

      supabaseClient.from("withdrawals").update({ status: "rejected" }).eq("id", wdId).then(function() {
        // Refund balance to user
        supabaseClient.from("profiles").select("balance").eq("id", userId).single().then(function(pRes) {
          var currentBal = Number(pRes.data ? pRes.data.balance : 0);
          var newBal = currentBal + Number(amount);

          supabaseClient.from("profiles").update({ balance: newBal }).eq("id", userId).then(function() {
            alert("উইথড্র রিজেক্ট করে টাকা ইউজারকে ফেরত দেওয়া হয়েছে!");
            loadWithdrawals();
          });
        });
      });
    };

    // 4. LOAD & HANDLE VIP PURCHASES
    function loadVipPurchases() {
      var tbody = document.getElementById("vipTableBody");
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">লোড হচ্ছে...</td></tr>';

      supabaseClient.from("vip_purchases").select("*").order("created_at", { ascending: false }).then(function(res) {
        if (res.error || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো VIP কেনাকাটার রেকর্ড নেই।</td></tr>';
          return;
        }

        var html = "";
        res.data.forEach(function(item) {
          var isPending = item.status === "pending";
          html += '<tr>' +
            '<td><small>' + item.user_id + '</small></td>' +
            '<td><small>' + item.package_id + '</small></td>' +
            '<td><b>৳' + item.amount + '</b></td>' +
            '<td><span class="badge badge-' + (item.status || 'pending') + '">' + (item.status || 'pending') + '</span></td>' +
            '<td>' +
              (isPending ? 
                '<button class="btn-green" onclick="approveVip(\'' + item.id + '\', \'' + item.user_id + '\', ' + item.amount + ')">Active করুন</button>' 
                : 'সক্রিয়') +
            '</td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      });
    }

    window.approveVip = function(vipId, userId, amount) {
      if (!confirm("ইউজারের ব্যালেন্স থেকে ৳" + amount + " কেটে নিয়ে VIP সক্রিয় করা হবে। নিশ্চিত?")) return;

      supabaseClient.from("profiles").select("balance").eq("id", userId).single().then(function(pRes) {
        var currentBal = Number(pRes.data ? pRes.data.balance : 0);

        if (currentBal < amount) {
          alert("ইউজারের অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
          return;
        }

        var newBal = currentBal - amount;
        supabaseClient.from("profiles").update({ balance: newBal }).eq("id", userId).then(function() {
          supabaseClient.from("vip_purchases").update({ status: "active" }).eq("id", vipId).then(function() {
            alert("VIP প্যাকেজ সফলভাবে সক্রিয় হয়েছে এবং ব্যালেন্স কেটে নেওয়া হয়েছে!");
            loadVipPurchases();
          });
        });
      });
    };

    // Attach Refresh Buttons
    document.getElementById("btnRefreshDeposits").onclick = loadDeposits;
    document.getElementById("btnRefreshWithdraws").onclick = loadWithdrawals;
    document.getElementById("btnRefreshVip").onclick = loadVipPurchases;

    // Initial Load
    loadDeposits();
    loadWithdrawals();
    loadVipPurchases();
  </script>
</body>
</html>
