<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUINCOME - Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #050b09;
    color: #ecfff4;
    min-height: 100vh;
  }
  header {
    text-align: center;
    margin-bottom: 25px;
  }
  header h1 {
    color: #39ff88;
    margin: 0;
    font-size: 26px;
    text-shadow: 0 0 12px rgba(57, 255, 136, 0.4);
  }
  header p {
    color: #8ca99a;
    font-size: 14px;
    margin-top: 5px;
  }
  .admin-container {
    max-width: 500px;
    margin: 0 auto;
  }
  .card {
    padding: 20px;
    background: #0c1a13;
    border: 1px solid #1c4d32;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
  }
  .card h3 {
    color: #39ff88;
    margin-top: 0;
    text-align: center;
    font-size: 18px;
  }
  .form-group {
    margin-top: 15px;
  }
  .form-group label {
    color: #c9edda;
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 600;
  }
  .form-group input {
    width: 100%;
    padding: 12px;
    background: #050b09;
    border: 1px solid #245039;
    color: #fff;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
  }
  .form-group input:focus {
    border-color: #39ff88;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s opacity;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-add { background: #21e875; color: #000; }
  .btn-sub { background: #ff4d4d; color: #fff; }
  .btn-search { background: #1c4d32; color: #39ff88; border: 1px solid #39ff8855; width: 100%; margin-top: 10px; }
  
  .user-info-box {
    display: none;
    background: #08130e;
    border: 1px dashed #245039;
    padding: 12px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 14px;
  }
  .user-info-box p { margin: 4px 0; color: #b0d1c0; }
  .user-info-box b { color: #fff; }

  .status-msg {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .status-success { background: #123d27; color: #39ff88; border: 1px solid #21e875; }
  .status-error { background: #3d1212; color: #ff6b6b; border: 1px solid #ff4d4d; }

  .history-list {
    font-size: 13px;
    max-height: 200px;
    overflow-y: auto;
  }
  .history-item {
    padding: 8px;
    border-bottom: 1px solid #1c4d32;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<header>
  <h1>🛡️ TUINCOME Admin Panel</h1>
  <p>ইউজার ব্যালেন্স কন্ট্রোল ও অ্যাডমিন ম্যানেজমেন্ট</p>
</header>

<div class="admin-container">
  <!-- ব্যালেন্স ম্যানেজমেন্ট সেকশন -->
  <div class="card">
    <h3>💰 ইউজার ব্যালেন্স কন্ট্রোল</h3>

    <div class="form-group">
      <label>User UID:</label>
      <input type="text" id="adminTargetUID" placeholder="যেমন: TU-1442">
    </div>

    <button type="button" class="btn btn-search" id="btnSearchUser"><i class="fa-solid fa-magnifying-glass"></i> 🔍 ইউজার চেক করুন</button>

    <!-- খুঁজে পাওয়া ইউজারের ডিটেইলস -->
    <div class="user-info-box" id="userInfoBox">
      <p>নাম: <b id="infoName">-</b></p>
      <p>ইমেইল: <b id="infoEmail">-</b></p>
      <p>বর্তমান ব্যালেন্স: <b id="infoBalance" style="color:#39ff88">৳0.00</b></p>
    </div>

    <div class="form-group">
      <label>টাকার পরিমাণ (৳):</label>
      <input type="number" id="adminAmount" placeholder="যেমন: 500" min="1">
    </div>

    <div class="btn-group">
      <button class="btn btn-add" id="btnAdminAdd">➕ ব্যালেন্স যোগ করুন</button>
      <button class="btn btn-sub" id="btnAdminSub">➖ ব্যালেন্স কমান</button>
    </div>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <!-- সাম্প্রতিক পরিবর্তন লগ -->
  <div class="card">
    <h3 style="font-size: 15px; color:#8ca99a;">📋 সাম্প্রতিক ব্যালেন্স আপডেট লগ</h3>
    <div class="history-list" id="actionHistory">
      <div style="text-align:center; color:#567565; padding: 10px;">এখনো কোনো অ্যাকশন নেওয়া হয়নি।</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('load', function() {

  // Supabase Configuration
  var SUPABASE_URL = "https://vtaojjjaekjijfziocay.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0YW9qamphZWtqaWpmemlvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTcwMDYsImV4cCI6MjEwMzQzMzAwNn0.9C1qpG41Z8tuwgYBO7LZKMP3LCYOzsgFNlhfqMUlues";

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var currentFoundUser = null;

  function showStatus(msg, isError) {
    var statusBox = document.getElementById("statusMessage");
    statusBox.textContent = msg;
    statusBox.className = "status-msg " + (isError ? "status-error" : "status-success");
    statusBox.style.display = "block";
  }

  function addHistoryLog(text, amountText, isAdd) {
    var historyContainer = document.getElementById("actionHistory");
    if (historyContainer.innerHTML.includes("এখনো কোনো অ্যাকশন নেওয়া হয়নি")) {
      historyContainer.innerHTML = "";
    }
    var item = document.createElement("div");
    item.className = "history-item";
    var color = isAdd ? "#21e875" : "#ff4d4d";
    item.innerHTML = '<span>' + text + '</span><b style="color:' + color + '">' + amountText + '</b>';
    historyContainer.insertBefore(item, historyContainer.firstChild);
  }

  // ১. ইউজার সার্চ করার লজিক (স্মার্ট ফিল্টার)
  async function searchUser() {
    var uidInput = document.getElementById("adminTargetUID").value.trim().toUpperCase();
    var infoBox = document.getElementById("userInfoBox");
    document.getElementById("statusMessage").style.display = "none";

    if (!uidInput) {
      showStatus("অনুগ্রহ করে একটি UID প্রবেশ করান!", true);
      infoBox.style.display = "none";
      currentFoundUser = null;
      return;
    }

    try {
      // প্রথমে custom_uid দিয়ে খোজা
      let { data: user } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('custom_uid', uidInput)
        .maybeSingle();

      // যদি custom_uid এ না পায় তবে শুধু নম্বর (যেমন 1442) দিয়ে অনুসন্ধান
      if (!user) {
        var numericId = uidInput.replace(/\D/g, '');
        if (numericId) {
          let { data: userBySerial } = await supabaseClient
            .from('profiles')
            .select('*')
            .or('serial_id.eq.' + numericId + ',id.eq.' + uidInput)
            .maybeSingle();
            
          user = userBySerial;
        }
      }

      if (!user) {
        showStatus("এই UID ( " + uidInput + " ) এর কোনো ইউজার ডাটাবেসে পাওয়া যায়নি!", true);
        infoBox.style.display = "none";
        currentFoundUser = null;
        return;
      }

      currentFoundUser = user;
      document.getElementById("infoName").textContent = user.full_name || "নাম পাওয়া যায়নি";
      document.getElementById("infoEmail").textContent = user.email || "ইমেইল পাওয়া যায়নি";
      document.getElementById("infoBalance").textContent = "৳ " + Number(user.balance || 0).toFixed(2);
      infoBox.style.display = "block";

    } catch (err) {
      showStatus("সার্চ করতে সমস্যা হয়েছে: " + err.message, true);
    }
  }

  // ২. ব্যালেন্স আপডেট করার ফাংশন
  async function updateBalanceByUID(actionType) {
    var uidInput = document.getElementById("adminTargetUID").value.trim().toUpperCase();
    var amountVal = parseFloat(document.getElementById("adminAmount").value);

    if (!uidInput) {
      showStatus("সঠিক User UID প্রদান করুন!", true);
      return;
    }
    if (isNaN(amountVal) || amountVal <= 0) {
      showStatus("সঠিক টাকার পরিমাণ লিখুন!", true);
      return;
    }

    if (!currentFoundUser) {
      await searchUser();
    }

    if (!currentFoundUser) return;

    try {
      var currentBalance = parseFloat(currentFoundUser.balance || 0);
      var newBalance = actionType === 'add' ? (currentBalance + amountVal) : (currentBalance - amountVal);

      if (actionType === 'subtract' && currentBalance < amountVal) {
        if (!confirm('ইউজারের বর্তমান ব্যালেন্স (৳' + currentBalance.toFixed(2) + ') কমানোর পরিমাণ অপেক্ষা কম! আপনি কি মাইনাস করতে চান?')) {
          return;
        }
      }

      // ডাটাবেসে নতুন ব্যালেন্স আপডেট
      const { error: updateErr } = await supabaseClient
        .from('profiles')
        .update({ balance: newBalance })
        .eq('id', currentFoundUser.id);

      if (updateErr) throw updateErr;

      currentFoundUser.balance = newBalance;
      document.getElementById("infoBalance").textContent = "৳ " + newBalance.toFixed(2);
      document.getElementById("adminAmount").value = "";

      var actionText = actionType === 'add' ? 'যোগ' : 'কমানো';
      showStatus('সফল! ব্যালেন্স ৳' + newBalance.toFixed(2) + ' এ আপডেট করা হয়েছে।', false);
      
      addHistoryLog(uidInput + ' (' + actionText + ')', (actionType === 'add' ? '+' : '-') + '৳' + amountVal, actionType === 'add');

    } catch (err) {
      showStatus("ব্যালেন্স আপডেট করতে ব্যর্থ: " + err.message, true);
    }
  }

  document.getElementById("btnSearchUser").onclick = searchUser;
  document.getElementById("btnAdminAdd").onclick = function() { updateBalanceByUID('add'); };
  document.getElementById("btnAdminSub").onclick = function() { updateBalanceByUID('subtract'); };

});
</script>

</body>
</html>
